<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Inkubator Penetas Tukik</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg:        #0e1117;
      --surface:   #161b26;
      --surface2:  #1e2535;
      --border:    #2a3347;
      --accent:    #00c4a0;
      --accent2:   #3d9bff;
      --warn:      #f59e0b;
      --danger:    #ef4444;
      --text:      #e2e8f0;
      --muted:     #7c8fa6;
      --on:        #00c4a0;
      --off:       #2a3347;
      --radius:    12px;
      --mono:      'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
    header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .spacer { flex: 1; }

    #conn-badge {
      font-size: 12px; font-weight: 500;
      padding: 5px 12px; border-radius: 99px;
      display: flex; align-items: center; gap: 6px;
      border: 1px solid transparent;
    }
    #conn-badge.online  { background:#1a2e25; color:var(--accent); border-color:#1f4a38; }
    #conn-badge.offline { background:#2e1a1a; color:var(--danger); border-color:#4a1f1f; }
    #conn-badge .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    #conn-badge.online .dot { animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .device-status {
      display:flex; align-items:center; gap:6px;
      font-size:11px; font-weight:600; margin-left:auto;
      padding:4px 10px; border-radius:99px; border:1px solid transparent;
    }
    .device-status.online  { background:#1a2e25; color:var(--accent); border-color:#1f4a38; }
    .device-status.offline { background:#2e1a1a; color:var(--danger); border-color:#4a1f1f; }
    .device-status .status-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .device-status.online .status-dot { animation: blink 2s infinite; }

    main { padding: 28px 32px; max-width: 1280px; margin: 0 auto; }

    .cards-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px; position: relative; overflow: hidden;
    }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
    }
    .card-a::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .card-b::before { background: linear-gradient(90deg, var(--accent2), #a855f7); }

    .card-header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .card-title { font-size:15px; font-weight:600; }
    .card-dot { width:8px;height:8px;border-radius:50%; background:var(--accent); }
    .card-b .card-dot { background: var(--accent2); }

    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
    .metric { background:var(--surface2); border-radius:8px; padding:12px 14px; }
    .metric-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; }
    .metric-value { font-family:var(--mono); font-size:24px; font-weight:500; }
    .metric-unit { font-size:12px; color:var(--muted); margin-left:3px; }

    .relays { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .relays-3 { grid-template-columns:repeat(3,1fr); }
    .relay-pill {
      border-radius:8px; padding:7px 6px; text-align:center;
      font-size:11px; font-weight:600; letter-spacing:.3px;
      border: 1px solid transparent; transition: all .3s;
    }
    .relay-pill.on  { background:#0d2e25; border-color:var(--on); color:var(--on); }
    .relay-pill.off { background:var(--surface2); border-color:var(--border); color:var(--muted); }

    .card-footer { margin-top:12px; font-size:11px; color:var(--muted); text-align:right; }

    .section-head {
      display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;
    }
    .section-title { font-size:16px; font-weight:600; }
    .section-sub { font-size:12px; color:var(--muted); }

    .filter-bar {
      display:flex; gap:10px; margin-left:auto; flex-wrap:wrap; align-items:center;
    }
    .filter-bar label { font-size:12px; color:var(--muted); white-space:nowrap; }
    .filter-bar select, .filter-bar input {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); border-radius:8px; padding:7px 12px;
      font-size:13px; font-family:inherit; outline:none; cursor:pointer;
    }
    .filter-bar select:focus, .filter-bar input:focus { border-color:var(--accent); }

    .btn {
      padding:8px 16px; border-radius:8px; border:none; cursor:pointer;
      font-size:13px; font-weight:500; font-family:inherit; transition: all .2s;
    }
    .btn-primary { background:var(--accent); color:#0a1f1a; }
    .btn-primary:hover { background:#00e0b8; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
    .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
    .btn-danger  { background:var(--danger); color:#fff; font-weight:600; }
    .btn-danger:hover { background:#dc2626; }
    .btn-excel { background:#1a6b3c; color:#e2e8f0; }
    .btn-excel:hover { background:#1f8048; }

    .interval-toggle {
      display:flex; align-items:center; gap:0;
      background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      overflow:hidden;
    }
    .itv-btn {
      padding:7px 13px; border:none; background:transparent;
      color:var(--muted); font-size:12px; font-weight:500;
      cursor:pointer; font-family:inherit; transition:all .2s;
      white-space:nowrap;
    }
    .itv-btn:not(:last-child) { border-right:1px solid var(--border); }
    .itv-btn.active {
      background:var(--accent); color:#0a1f1a;
    }
    .itv-btn:hover:not(.active) { color:var(--text); background:var(--border); }

    .slot-label {
      display:inline-block; font-size:10px; font-weight:600;
      background:#1a3a2e; color:var(--accent); border:1px solid #1f5a44;
      border-radius:4px; padding:1px 6px; margin-left:6px;
      vertical-align:middle; letter-spacing:.4px;
    }

    .tabs { display:flex; gap:4px; background:var(--surface2); padding:4px; border-radius:10px; width:fit-content; margin-bottom:20px; }
    .tab {
      padding:7px 18px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer;
      border:none; background:transparent; color:var(--muted); transition: all .2s; font-family:inherit;
    }
    .tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.4); }

    .table-wrap { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead tr { background:var(--surface2); }
    th {
      padding:11px 14px; text-align:left; font-weight:600; font-size:11px;
      text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
      white-space:nowrap; border-bottom:1px solid var(--border);
    }
    td {
      padding:11px 14px; border-bottom:1px solid var(--border);
      font-family:var(--mono); font-size:12px; white-space:nowrap;
    }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:var(--surface2); }

    .table-notice td {
      text-align:center;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--warn);
      background: #2a1f08;
      padding: 8px 14px;
      border-bottom: none;
      letter-spacing: .3px;
    }

    .badge {
      display:inline-block; padding:2px 8px; border-radius:99px;
      font-size:11px; font-weight:600;
    }
    .badge-on  { background:#0d2e25; color:var(--on);   border:1px solid #1a5a3a; }
    .badge-off { background:var(--off); color:var(--muted); border:1px solid var(--border); }

    .empty-state {
      text-align:center; padding:48px; color:var(--muted);
    }
    .empty-state .icon { font-size:36px; margin-bottom:10px; }
    .empty-state p { font-size:14px; }

    #loading {
      display:none; text-align:center; padding:32px; color:var(--muted);
      font-size:13px; letter-spacing:.3px;
    }
    .spinner {
      width:24px; height:24px; border:2px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin .8s linear infinite; margin:0 auto 12px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .summary-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .chip {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:8px; padding:8px 14px; font-size:12px;
    }
    .chip strong { color:var(--accent); font-family:var(--mono); }

    @media (max-width: 768px) {
      main { padding:16px; }
      .cards-row { grid-template-columns:1fr; }
      .relays { grid-template-columns:repeat(2,1fr); }
      .relays-3 { grid-template-columns:repeat(3,1fr); }
      header { padding:14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🐢</div>
  <div>
    <h1>Inkubator Penetas Tukik</h1>
    <div class="sub">Sistem Monitoring IoT Real-time</div>
  </div>
  <div class="spacer"></div>
  <div id="conn-badge" class="offline"><span class="dot"></span><span class="label">Menghubungkan...</span></div>
</header>

<main>

  <!-- ── LIVE STATUS ── -->
  <div class="cards-row">
    <!-- Inkubator A -->
    <div class="card card-a">
      <div class="card-header">
        <div class="card-dot"></div>
        <span class="card-title">Inkubator A</span>
        <span class="device-status offline" id="statusA"><span class="status-dot"></span><span class="status-text">Menghubungkan...</span></span>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Suhu</div>
          <div class="metric-value"><span id="suhuA">--</span><span class="metric-unit">°C</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Kelembapan</div>
          <div class="metric-value"><span id="kelembapanA">--</span><span class="metric-unit">%</span></div>
        </div>
      </div>
      <div class="relays">
        <div class="relay-pill off" id="lampuA">Lampu</div>
        <div class="relay-pill off" id="pompaA">Pompa</div>
        <div class="relay-pill off" id="peltierA">Peltier</div>
        <div class="relay-pill off" id="fanA">Fan</div>
      </div>
      <div class="card-footer">Diperbarui: <span id="lastUpdateA">--</span></div>
    </div>

    <!-- Inkubator B -->
    <div class="card card-b">
      <div class="card-header">
        <div class="card-dot"></div>
        <span class="card-title">Inkubator B</span>
        <span class="device-status offline" id="statusB"><span class="status-dot"></span><span class="status-text">Menghubungkan...</span></span>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Suhu</div>
          <div class="metric-value"><span id="suhuB">--</span><span class="metric-unit">°C</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Kelembapan</div>
          <div class="metric-value"><span id="kelembapanB">--</span><span class="metric-unit">%</span></div>
        </div>
      </div>
      <div class="relays relays-3">
        <div class="relay-pill off" id="lampuB">Lampu</div>
        <div
