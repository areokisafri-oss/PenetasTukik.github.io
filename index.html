<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring Inkubator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      border-radius: 6px;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
    .itv-btn { padding: 6px 12px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 4px; }
    .itv-btn.active { background: var(--accent); color: #000; }
    
    input[type="datetime-local"] { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; }
    button.btn-action { padding: 6px 12px; background: var(--accent); border: none; color: #000; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button.btn-action:hover { background: var(--accent-hover); color: #fff; }
    button.btn-danger { background: var(--danger); color: #fff; }
    button.btn-danger:hover { background: var(--danger-hover); }

    .summary-bar { display: flex; gap: 20px; background: var(--card-bg); padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid var(--border); }
    .summary-item { font-size: 0.9rem; }
    .summary-item span { font-weight: bold; color: var(--accent); }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 6px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #111827; }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-on { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    
    .slot-label { display: block; font-size: 0.75rem; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
    .table-notice { background: rgba(56, 189, 248, 0.1); text-align: center; font-size: 0.85rem; color: var(--accent); }
    #loading { text-align: center; padding: 40px; font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>Monitoring Inkubator</h1>

  <!-- NAV TAB -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('A', this)">Inkubator A</button>
    <button class="tab" onclick="switchTab('B', this)">Inkubator B</button>
  </div>

  <!-- CONTROLS & FILTER -->
  <div class="controls">
    <div>
      <span>Interval: </span>
      <button class="itv-btn active" onclick="setInterval_('all', this)">Semua</button>
      <button class="itv-btn" onclick="setInterval_(30, this)">30m</button>
      <button class="itv-btn" onclick="setInterval_(60, this)">1j</button>
      <button class="itv-btn" onclick="setInterval_(360, this)">6j</button>
      <button class="itv-btn" onclick="setInterval_(1440, this)">1d</button>
    </div>

    <div>
      <input type="datetime-local" id="filterFrom">
      <span>s/d</span>
      <input type="datetime-local" id="filterTo">
      <button class="btn-action" onclick="applyFilter()">Filter</button>
      <button class="btn-action" onclick="resetFilter()" style="background:var(--card-bg); color:var(--text); border:1px solid var(--border);">Reset</button>
    </div>

    <div style="margin-left: auto; display: flex; gap: 8px;">
      <button class="btn-action" onclick="exportExcel()">Export Excel</button>
      <button class="btn-action btn-danger" onclick="deleteAll()">Hapus Semua Data</button>
    </div>
  </div>

  <!-- SUMMARY BAR -->
  <div class="summary-bar" id="summaryRow" style="display: none;">
    <div class="summary-item">Total Data: <span id="sumTotal">0</span></div>
    <div class="summary-item">Rata-rata Suhu: <span id="sumSuhu">0</span> °C</div>
    <div class="summary-item">Rata-rata Kelembapan: <span id="sumKelembapan">0</span> %</div>
    <div class="summary-item">Rentang Waktu: <span id="sumRange">-</span></div>
  </div>

  <p id="sectionSub" style="color: var(--muted); font-size: 0.9rem;">Menampilkan semua data</p>

  <!-- LOADING STATE -->
  <div id="loading" style="display: none;">
    ⏳ Memuat data dari Firebase... 
    <div id="loadingDetail" style="font-size: 0.85rem; color: var(--muted); margin-top: 5px;"></div>
  </div>

  <!-- TABLE -->
  <div id="tableWrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<!-- FIREBASE MODULE & LOGIC MAIN SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import {
  getDatabase, ref, onValue
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

/* ── CONFIG ── */
const firebaseConfig = {
  apiKey: "AIzaSyAnY7-nTOG8qv9MmzHNgD3Y-WFUfp0bTdI",
  authDomain: "penetastukik-c4242.firebaseapp.com",
  databaseURL: "https://penetastukik-c4242-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "penetastukik-c4242",
  storageBucket: "penetastukik-c4242.firebasestorage.app",
  messagingSenderId: "490317997302",
  appId: "1:490317997302:web:cf3c8d756e7c39cf9df8d7",
  measurementId: "G-MZTK2W5RJM"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── STATE ── */
let currentTab      = 'A';
let allRowsA        = [];
let allRowsB        = [];
let filteredRows    = [];
let currentInterval = 'all';
let loadedA         = false;
let loadedB         = false;

/* Batas baris yang digambar ke DOM */
const MAX_RENDER = 1000;

/* ── LIVE CARD HELPERS ── */
function uv(id, val, suf = '') {
  const el = document.getElementById(id);
  if (el) el.textContent = val + suf;
}
function fmtWIB() {
  return new Intl.DateTimeFormat('id-ID', {
    timeZone:'Asia/Jakarta', day:'2-digit', month:'short',
    year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).format(new Date()) + ' WIB';
}
function setRelay(id, state) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'relay-pill ' + (state ? 'on' : 'off');
}

/* ── LIVE LISTENERS ── */
onValue(ref(db,'inkubatorA/suhu'),        s => { uv('suhuA', s.val()); uv('lastUpdateA', fmtWIB()); });
onValue(ref(db,'inkubatorA/kelembapan'), s => uv('kelembapanA', s.val()));
onValue(ref(db,'inkubatorA/relay/lampu'),   s => setRelay('lampuA',   s.val()));
onValue(ref(db,'inkubatorA/relay/pompa'),   s => setRelay('pompaA',   s.val()));
onValue(ref(db,'inkubatorA/relay/peltier'), s => setRelay('peltierA', s.val()));
onValue(ref(db,'inkubatorA/relay/fan'),     s => setRelay('fanA',     s.val()));

onValue(ref(db,'inkubatorB/suhu'),        s => { uv('suhuB', s.val()); uv('lastUpdateB', fmtWIB()); });
onValue(ref(db,'inkubatorB/kelembapan'), s => uv('kelembapanB', s.val()));
onValue(ref(db,'inkubatorB/relay/lampu'),   s => setRelay('lampuB',   s.val()));
onValue(ref(db,'inkubatorB/relay/pompa'),   s => setRelay('pompaB',   s.val()));
onValue(ref(db,'inkubatorB/relay/fan'),     s => setRelay('fanB',     s.val()));

/* ── RENDER HEADER TABEL ── */
function renderTableHead() {
  const thead = document.getElementById('tableHead');
  if (!thead) return;

  const isA = currentTab === 'A';
  thead.innerHTML = `
    <tr>
      <th>#</th>
      <th>Waktu</th>
      <th>Suhu (°C)</th>
      <th>Kelembapan (%)</th>
      <th>ADC</th>
      <th>Lampu</th>
      <th>Pompa</th>
      ${isA ? '<th>Peltier</th>' : ''}
      <th>Fan</th>
    </tr>`;
}

/* ── LOAD LOG (Memakai REST API Shallow agar tidak menghabiskan RAM saat data besar) ── */
async function loadLog(inkubator) {
  showLoading(true, inkubator);
  const detail = document.getElementById('loadingDetail');
  
  try {
    if (detail) detail.textContent = `(Membaca data Inkubator ${inkubator}...)`;
    
    // Menggunakan Shallow Query REST API untuk membaca snapshot log
    const res = await fetch(`${firebaseConfig.databaseURL}/log${inkubator}.json?shallow=true`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const keysObj = await res.json();
    const rows = [];

    if (keysObj && typeof keysObj === 'object') {
      // Ambil detail data terbatas (1000 item terakhir) untuk ditampilkan di awal secara cepat
      const dataRes = await fetch(`${firebaseConfig.databaseURL}/log${inkubator}.json?orderBy="$key"&limitToLast=1000`);
      if (dataRes.ok) {
        const dataObj = await dataRes.json();
        if (dataObj) {
          Object.keys(dataObj).forEach(key => {
            const d = dataObj[key];
            rows.push({
              epoch:      Number(key),
              timestamp:  d.timestamp  || '',
              suhu:       d.suhu       ?? '',
              kelembapan: d.kelembapan ?? '',
              adc:        d.adc        ?? '',
              lampu:      d.lampu      ?? false,
              pompa:      d.pompa      ?? false,
              peltier:    d.peltier    ?? false,
              fan:        d.fan        ?? false
            });
          });
          rows.reverse();
        }
      }
    }

    if (inkubator === 'A') { allRowsA = rows; loadedA = true; }
    else                   { allRowsB = rows; loadedB = true; }

    if (inkubator === currentTab) {
      renderTable(samplingInterval(rows, currentInterval));
    }
  } catch (err) {
    console.error('loadLog error:', err);
    const tbody = document.getElementById('historyBody');
    if (tbody) {
      const cols = currentTab === 'A' ? 9 : 8;
      tbody.innerHTML = `<tr><td colspan="${cols}"><div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat data: ${err.message}</p></div></td></tr>`;
    }
  } finally {
    showLoading(false);
  }
}

loadLog('A');

/* ── RENDER TABLE ── */
function renderTable(rows) {
  const tbody     = document.getElementById('historyBody');
  const showCol7  = currentTab === 'A';
  const totalCols = showCol7 ? 9 : 8;

  renderTableHead();
  filteredRows = rows;

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${totalCols}"><div class="empty-state"><div class="icon">📭</div><p>Tidak ada data. Riwayat kosong.</p></div></td></tr>`;
    document.getElementById('summaryRow').style.display = 'none';
    return;
  }

  const avgSuhu  = (rows.reduce((s,r)=>s+Number(r.suhu||0),0)/rows.length).toFixed(1);
  const avgHum   = Math.round(rows.reduce((s,r)=>s+Number(r.kelembapan||0),0)/rows.length);
  const oldest   = rows[rows.length-1].timestamp ? rows[rows.length-1].timestamp.slice(0,16).replace('T',' ') : '-';
  const newest   = rows[0].timestamp ? rows[0].timestamp.slice(0,16).replace('T',' ') : '-';

  document.getElementById('sumTotal').textContent       = rows.length;
  document.getElementById('sumSuhu').textContent        = avgSuhu;
  document.getElementById('sumKelembapan').textContent  = avgHum;
  document.getElementById('sumRange').textContent       = oldest + ' → ' + newest;
  document.getElementById('summaryRow').style.display   = 'flex';

  const visibleRows = rows.length > MAX_RENDER ? rows.slice(0, MAX_RENDER) : rows;

  const html = visibleRows.map((r, i) => {
    const ts    = r.timestamp ? r.timestamp.replace('T',' ').replace('+07:00',' WIB') : '-';
    const suhu  = r.suhu      !== '' ? Number(r.suhu).toFixed(1)  : '-';
    const hum   = r.kelembapan!== '' ? r.kelembapan : '-';
    const adc   = r.adc       !== '' ? Number(r.adc).toFixed(0)   : '-';
    const badge = v => `<span class="badge ${v?'badge-on':'badge-off'}">${v?'ON':'OFF'}</span>`;

    let slotBadge = '';
    if (currentInterval !== 'all' && r.epoch) {
      const slotSec   = currentInterval * 60;
      const slotStart = Math.floor(r.epoch / slotSec) * slotSec;
      const d         = new Date(slotStart * 1000);
      const hh        = String(d.getUTCHours() + 7).padStart(2,'0');
      const mm        = String(d.getUTCMinutes()).padStart(2,'0');
      const fixHh     = String(Number(hh) % 24).padStart(2,'0');
      slotBadge = `<span class="slot-label">Slot ${fixHh}:${mm}</span>`;
    }

    const col7Td = showCol7 ? `<td>${badge(r.peltier)}</td>` : '';

    return `<tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td>${ts}${slotBadge}</td>
      <td>${suhu}</td>
      <td>${hum}</td>
      <td style="color:var(--muted)">${adc}</td>
      <td>${badge(r.lampu)}</td>
      <td>${badge(r.pompa)}</td>
      ${col7Td}
      <td>${badge(r.fan)}</td>
    </tr>`;
  }).join('');

  const noticeRow = rows.length > MAX_RENDER
    ? `<tr class="table-notice"><td colspan="${totalCols}">
         Menampilkan ${MAX_RENDER.toLocaleString('id-ID')} baris teratas dari ${rows.length.toLocaleString('id-ID')} baris.
         Persempit rentang tanggal atau pakai tombol interval untuk melihat sisanya.
       </td></tr>`
    : '';

  tbody.innerHTML = html + noticeRow;
}

/* ── SAMPLING INTERVAL ── */
function samplingInterval(rows, intervalMenit) {
  if (intervalMenit === 'all' || !intervalMenit) return rows;

  const slotDetik = intervalMenit * 60;
  const slotMap = new Map();

  rows.forEach(r => {
    const slotKey   = Math.floor(r.epoch / slotDetik);
    const slotStart = slotKey * slotDetik;
    const delta     = Math.abs(r.epoch - slotStart);

    if (!slotMap.has(slotKey)) {
      slotMap.set(slotKey, { row: r, delta });
    } else {
      if (delta < slotMap.get(slotKey).delta) {
        slotMap.set(slotKey, { row: r, delta });
      }
    }
  });

  return [...slotMap.values()]
    .sort((a, b) => b.row.epoch - a.row.epoch)
    .map(v => v.row);
}

/* ── UBAH INTERVAL ── */
window.setInterval_ = function(val, btn) {
  currentInterval = val;
  document.querySelectorAll('.itv-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const sub = document.getElementById('sectionSub');
  const labels = { all:'Menampilkan semua data', 30:'Disampling setiap 30 menit', 60:'Disampling setiap 1 jam', 360:'Disampling setiap 6 jam', 1440:'Disampling setiap 1 hari' };
  if (sub) sub.textContent = labels[val] ?? `Disampling setiap ${val} menit`;

  applyFilter();
};

/* ── FILTER ── */
window.applyFilter = function() {
  const from = document.getElementById('filterFrom').value;
  const to   = document.getElementById('filterTo').value;
  let src    = currentTab === 'A' ? allRowsA : allRowsB;

  if (from || to) {
    const fromEpoch = from ? new Date(from).getTime() / 1000 : 0;
    const toEpoch   = to   ? new Date(to).getTime()   / 1000 : Infinity;
    src = src.filter(r => r.epoch >= fromEpoch && r.epoch <= toEpoch);
  }

  renderTable(samplingInterval(src, currentInterval));
};

/* ── RESET ── */
window.resetFilter = function() {
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value   = '';

  currentInterval = 'all';
  document.querySelectorAll('.itv-btn').forEach(b => b.classList.remove('active'));
  const firstBtn = document.querySelector('.itv-btn');
  if (firstBtn) firstBtn.classList.add('active');

  const sub = document.getElementById('sectionSub');
  if (sub) sub.textContent = 'Menampilkan semua data';

  showLoading(true, currentTab);

  requestAnimationFrame(() => {
    setTimeout(() => {
      const src = currentTab === 'A' ? allRowsA : allRowsB;
      renderTable(src);
      showLoading(false);
    }, 0);
  });
};

/* ── HAPUS BERTAHAP (BATCH DELETE PER 1000 DATA VIA REST API) ── */
window.deleteAll = async function() {
  const step1 = confirm(
    `⚠️ HAPUS SELURUH riwayat Inkubator ${currentTab} dari Firebase?\n\n` +
    `Proses ini akan menghapus data secara bertahap sampai bersih total.`
  );
  if (!step1) return;

  const typed = prompt(
    `Ketik HAPUS (huruf besar) untuk konfirmasi penghapusan Inkubator ${currentTab}:`
  );
  if (typed !== 'HAPUS') {
    alert('Dibatalkan. Data tidak dihapus.');
    return;
  }

  showLoading(true, currentTab);
  const sub = document.getElementById('sectionSub');
  const detail = document.getElementById('loadingDetail');

  const targetNode = `log${currentTab}`;
  const baseUrl = `${firebaseConfig.databaseURL}/${targetNode}`;
  let totalDeleted = 0;
  const chunkSize = 1000;

  try {
    while (true) {
      if (sub) sub.textContent = 'Memeriksa & menghapus batch data...';
      if (detail) detail.textContent = `(Telah dihapus: ${totalDeleted.toLocaleString('id-ID')} record)`;

      // 1. Ambil 1000 key pertama menggunakan shallow query REST API
      const shallowRes = await fetch(`${baseUrl}.json?shallow=true&limitToFirst=${chunkSize}`);
      if (!shallowRes.ok) throw new Error(`HTTP Status ${shallowRes.status}`);

      const keysObj = await shallowRes.json();

      // Jika node sudah kosong / null, hentikan loop
      if (!keysObj || typeof keysObj !== 'object' || Object.keys(keysObj).length === 0) {
        break;
      }

      const keys = Object.keys(keysObj);

      // 2. Buat objek payload { key1: null, key2: null, ... }
      const payload = {};
      keys.forEach(k => { payload[k] = null; });

      // 3. Kirim PATCH request untuk menghapus 1000 item sekaligus dalam 1 payload kecil
      const patchRes = await fetch(`${baseUrl}.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!patchRes.ok) {
        throw new Error(`Gagal menghapus batch: ${patchRes.statusText}`);
      }

      totalDeleted += keys.length;

      // Jika jumlah key yang didapat kurang dari chunkSize, berarti ini adalah batch terakhir
      if (keys.length < chunkSize) {
        break;
      }
    }

    // Reset State Lokal setelah hapus selesai
    if (currentTab === 'A') { 
      allRowsA = []; 
      loadedA = true; 
    } else { 
      allRowsB = []; 
      loadedB = true; 
    }

    filteredRows = [];
    renderTable([]);

    if (sub) sub.textContent = 'Riwayat kosong';
    alert(`✅ Berhasil menghapus total ${totalDeleted.toLocaleString('id-ID')} data dari Inkubator ${currentTab}!`);

  } catch (err) {
    console.error('deleteAll error:', err);
    alert('❌ Gagal menghapus bertahap! Cek koneksi atau Firebase Rules.\n\nPesan Error: ' + err.message);
  } finally {
    showLoading(false);
  }
};

/* ── TAB SWITCH ── */
window.switchTab = function(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  renderTableHead();

  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value   = '';

  const isLoaded = tab === 'A' ? loadedA : loadedB;
  if (!isLoaded) {
    loadLog(tab);
  } else {
    const src = tab === 'A' ? allRowsA : allRowsB;
    renderTable(samplingInterval(src, currentInterval));
  }
};

/* ── LOADING ── */
function showLoading(show, inkubator) {
  document.getElementById('loading').style.display   = show ? 'block' : 'none';
  document.getElementById('tableWrap').style.display = show ? 'none'  : 'block';
  const detail = document.getElementById('loadingDetail');
  if (detail) detail.textContent = show && inkubator ? `(Inkubator ${inkubator})` : '';
}

/* ── EXPORT EXCEL (SheetJS via CDN) ── */
window.exportExcel = function() {
  if (!filteredRows || filteredRows.length === 0) {
    alert('Tidak ada data untuk diekspor.');
    return;
  }

  if (!window.XLSX) {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => doExport();
    document.head.appendChild(script);
  } else {
    doExport();
  }

  function doExport() {
    const isA = currentTab === 'A';
    const header = isA
      ? ['No','Waktu','Suhu (°C)','Kelembapan (%)','ADC','Lampu','Pompa','Peltier','Fan']
      : ['No','Waktu','Suhu (°C)','Kelembapan (%)','ADC','Lampu','Pompa','Fan'];

    const data = [header, ...filteredRows.map((r, i) => {
      const base = [
        i + 1,
        r.timestamp ? r.timestamp.replace('T',' ').replace('+07:00','') : '-',
        r.suhu        !== '' ? Number(r.suhu).toFixed(1)  : '-',
        r.kelembapan !== '' ? r.kelembapan                 : '-',
        r.adc        !== '' ? Number(r.adc).toFixed(0)    : '-',
        r.lampu    ? 'ON' : 'OFF',
        r.pompa    ? 'ON' : 'OFF'
      ];
      const tail = [r.fan ? 'ON' : 'OFF'];
      if (isA) base.push(r.peltier ? 'ON' : 'OFF');
      return [...base, ...tail];
    })];

    const ws = window.XLSX.utils.aoa_to_sheet(data);

    ws['!cols'] = isA
      ? [{wch:5},{wch:22},{wch:12},{wch:17},{wch:10},{wch:8},{wch:8},{wch:10},{wch:8}]
      : [{wch:5},{wch:22},{wch:12},{wch:17},{wch:10},{wch:8},{wch:8},{wch:8}];

    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, `Inkubator ${currentTab}`);

    const now = new Date();
    const fname = `Log_Inkubator${currentTab}_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.xlsx`;

    window.XLSX.writeFile(wb, fname);
  }
};
</script>
